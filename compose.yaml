
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  caddy:
    image: caddy:latest
    ports:
      - "7999:80"
    volumes:
      - .:/var/www/html
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - php
    networks:
      - app-network

###> doctrine/doctrine-bundle ###
  # Gleiche Version wie in Produktion (compose.prod.yaml). App: DATABASE_URL in .env, siehe docs/deployment.md.
  database:
    image: mysql:26.10.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql:rw
    networks:
      - app-network
###< doctrine/doctrine-bundle ###

networks:
  app-network:
    driver: bridge

volumes:
###> doctrine/doctrine-bundle ###
  # Dev-Daten (Volume advent_mysql_data). Die Produktion nutzt eigene Namen (advent_prod_mysql_data).
  mysql_data:
###< doctrine/doctrine-bundle ###
