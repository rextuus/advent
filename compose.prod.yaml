# Advent – Produktion auf einem einzelnen Server.
# Aufruf (Komodo macht genau das, `make prod-up` ebenso):
#   docker compose -p advent -f compose.prod.yaml --env-file .env.prod.local up -d --build --wait
# Reihenfolge beim Start: database (gesund) → migrate (Migrationen, einmalig) → app → web.
# Secrets kommen ausschließlich aus .env.prod.local (Vorlage: .env.prod.dist; bei Komodo schreibt
# Komodo die Datei bei jedem Deploy aus den im UI hinterlegten Variablen). Ablauf: docs/deployment.md.
name: advent

# Docker-Logs begrenzen (sonst wachsen sie unbegrenzt): je Dienst höchstens 5 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: docker/prod/Dockerfile
    target: prod
  image: advent-app:prod
  # Selbst gebaut, nie aus einer Registry: `docker compose pull` (Komodo „Pull Images“) überspringt den Dienst.
  pull_policy: build
  restart: unless-stopped
  logging: *logging
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
    APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env.prod.local}
    DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI fehlt in .env.prod.local}
    DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.4.11&charset=utf8mb4
    # PHP bekommt Anfragen nur vom Caddy im Docker-Netz (private Adresse).
    TRUSTED_PROXIES: private_ranges
    # Fehlermeldungen an Sentry (leer = aus)
    SENTRY_DSN: ${SENTRY_DSN:-}
    # Nur für Fixtures/app:update-door (bcrypt-Hash); im Betrieb nicht nötig
    USER_PASSWORD: ${USER_PASSWORD:-}

services:
  # Einmalig bei jedem Deploy: Datenbank migrieren, dann beendet (Exit 0).
  # In Komodo unter ignore_services, damit der Stack trotzdem als „Running“ gilt.
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      database:
        condition: service_healthy

  # app startet erst, wenn die Migrationen durch sind. Schlägt migrate fehl, ist der alte Container schon
  # ersetzt und der neue startet nicht: Seite unten bis zum Rollback (docs/deployment.md, „Rollback“).
  app:
    <<: *app
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: web
    image: advent-web:prod
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    environment:
      # Nur von diesen Adressen gelten X-Forwarded-* (Gast-IP, https): die WireGuard-IP des VPS.
      REVERSE_PROXY_IPS: ${REVERSE_PROXY_IPS:-private_ranges}
    ports:
      # Der einzige Port nach außen, nur auf der WireGuard-Adresse dieses Rechners (HTTP_BIND).
      - "${HTTP_BIND:?HTTP_BIND fehlt}:${HTTP_PORT:-7999}:80"
    # Prüft den ganzen Weg, den auch der VPS nimmt: Caddy → PHP → Datenbank.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  database:
    image: mysql:8.4.11
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

  # Datenbank-Dump nach BACKUP_DIR (Standard /srv/advent/backups auf dem Host), mit Rotation (deploy/komodo/db-backup.sh).
  # Startet nie von selbst (Profil), nur per `docker compose run --rm backup <anlass>`: vor jedem Deploy
  # (pre-deploy.sh, Anlass pre-deploy), täglich über die Komodo-Procedure advent-backup (Anlass daily), oder von Hand.
  backup:
    image: mysql:8.4.11
    profiles: ["backup"]
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "/usr/local/bin/advent-db-backup"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./deploy/komodo/db-backup.sh:/usr/local/bin/advent-db-backup:ro
      # Der Ordner muss auf dem Host schon existieren (einmalig anlegen, docs/deployment.md). Docker legt ihn
      # so nicht still neu an – ein Tippfehler in BACKUP_DIR lässt die Sicherung scheitern statt ins Leere zu gehen.
      - type: bind
        source: ${BACKUP_DIR:-/srv/advent/backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy

# Feste Namen, damit die Daten nicht am Projektnamen hängen. Niemals umbenennen.
# Bewusst NICHT advent_database_data: so heißt das Volume der Entwicklungsumgebung (compose.yaml, Projekt „advent“
# = Ordnername). VOLUME_PREFIX nur für Probeläufe setzen (z. B. adventprobe).
volumes:
  database_data:
    name: ${VOLUME_PREFIX:-advent}_prod_mysql_data
